<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body onload="showStartScreen()">
    <div id="game-container">
      <canvas id="canvas" width="720" height="480" tabindex="0"></canvas>

      <div id="game-overlay" class="game-overlay">
        <div class="menu-layer">
          <h1 id="overlay-title" class="game-title">El Pollo Loco</h1>

          <p id="overlay-message" class="game-subtitle">
            Collect bottles, defeat chickens and beat the final boss.
          </p>

          <div class="main-actions">
            <button
              id="start-button"
              class="menu-button start-button"
              type="button"
              onclick="startGame()"
            >
              Start
            </button>

            <button
              id="restart-button"
              class="menu-button hidden"
              type="button"
              onclick="restartGame()"
            >
              Restart
            </button>

            <button
              id="home-button"
              class="menu-button hidden"
              type="button"
              onclick="goToHomeScreen()"
            >
              Home
            </button>
          </div>

          <div class="round-actions">
            <button
              id="sound-button"
              class="round-button"
              type="button"
              onclick="toggleSound()"
            >
              <img id="sound-icon" src="symbols/music_on.png" alt="" />
              <span id="sound-label">Sound</span>
            </button>

            <button
              id="controls-button"
              class="round-button"
              type="button"
              onclick="toggleControls()"
            >
              <img src="symbols/help_open.png" alt="" />
              <span>Controls</span>
            </button>

            <button
              id="fullscreen-button"
              class="round-button"
              type="button"
              onclick="toggleFullscreen()"
            >
              <img
                id="fullscreen-icon"
                src="symbols/enter-fullscreen.png"
                alt=""
              />
              <span>Fullscreen</span>
            </button>
          </div>

          <div id="controls-panel" class="controls-panel">
            <div class="control-group">
              <strong>Move</strong>
              <div class="key-row">
                <span class="key">←</span>
                <span class="key">→</span>
              </div>
            </div>

            <div class="control-group">
              <strong>Jump</strong>
              <div class="key-row">
                <span class="key wide-key">Space</span>
              </div>
            </div>

            <div class="control-group">
              <strong>Throw</strong>
              <div class="key-row">
                <span class="key">D</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/background.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chick.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/statusbar.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/collectable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/collision-manager.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/audio-manager.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
